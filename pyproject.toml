[project]
name = "wallexer"
version = "0.1.0"
description = "Automated spot-trading engine + CLI for the Wallex (wallex.ir) hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "openai>=1.40",
    "numpy>=1.26",
    "polars>=1.0",
    "textual>=8.2.8",
    "prompt-toolkit>=3.0.53",
    "platformdirs>=4.2",
    # zoneinfo data for Tehran time in `sum` (slim images and some macOS Pythons lack it)
    "tzdata>=2024.1",
]

[project.scripts]
wallexer = "wallexer.cli.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallexer"]

# An installed CLI (uv tool install) has no repo checkout: ship the defaults and market lists.
[tool.hatch.build.targets.wheel.force-include]
"config/default.toml" = "wallexer/_resources/default.toml"
"data/not_allowed.txt" = "wallexer/_resources/not_allowed.txt"
"data/unavailable_markets.txt" = "wallexer/_resources/unavailable_markets.txt"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Formatter wraps code; long user-facing strings and SQL comments are allowed.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters via default values; that is the intended usage.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
