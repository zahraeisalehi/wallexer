# wallexer defaults. Runtime-learned values (e.g. min order value) go to data/overrides.toml,
# which is layered on top of this file. Secrets come only from env / .env.

[exchange]
base_url = "https://api.wallex.ir"
timeout_s = 10.0
# Order placement gets its own (longer) timeout: a timeout means "status unknown", not "failed".
order_timeout_s = 15.0
get_retries = 3
backoff_base_s = 0.5

[ratelimit.market]
# The exchange reports x-ratelimit-limit/remaining but not the window length.
# Confirmed by the user: 600 requests per 39 s window.
window_s = 39.0
limit = 600
backoff_below_frac = 0.10

[ratelimit.orders]
# Exchange rule: max 20 order requests (create + cancel) per 10 s. We cap at 15 for headroom.
max_requests = 15
window_s = 10.0
# Queue depth (waiting requests) at which a risk event is logged.
backlog_warn = 5

[account]
# Trading-credit (sub) account starts with ~5M TMN. Equity (TMN + coins at best bid) must be
# within this tolerance or shadow/trade refuse to start.
expected_equity_tmn = "5000000"
equity_tolerance_pct = "10"

[orders]
# Confirmed by the user: 100,000 TMN (USDT markets: TMN equivalent via USDTTMN).
# Safety net: a too-small rejection still updates data/overrides.toml.
min_order_value_tmn = "100000"
min_order_verified = true
# New positions must be at least this multiple of the minimum, so a position that loses value
# can still be sold in full (positions are never left below the minimum).
min_entry_multiple = "2.0"
# Exits (stop-loss, final flatten) on markets where MARKET orders are disabled
# (is_market_type_enable = false) use an aggressive LIMIT this far past the best opposite price,
# re-priced if still unfilled after exit_reprice_after_s.
exit_limit_slippage_pct = "0.5"
exit_reprice_after_s = 10
exit_max_reprices = 5
# A remainder worth less than this after a full sell is accepted as dust (logged, exported).
dust_cap_tmn = "1000"

[fees]
# Fallback rates when /v1/account/fee has no usable entry for a market. Set to the highest
# observed tier (0.25%/0.30%, rounded up to 0.30% both) so a fallback never understates costs.
# Markets priced with these are marked source = "default" and doctor shows a warning.
default_maker = "0.003"
default_taker = "0.003"

[universe]
top_n = 30
# Default universe = markets with MARKET orders enabled (7 on 2026-10-22). LIMIT-only markets
# are opt-in and get half the max position.
include_limit_only = false
max_markets = 12
unavailable_path = "data/unavailable_markets.txt"
min_quote_volume_tmn = "500000000"
max_spread_bps = "100"
quote_assets = ["TMN", "USDT"]
not_allowed_path = "data/not_allowed.txt"

[llm]
base_url = "https://ai.boxapi.ir/ai/v1"
model = "gpt-5.4-mini"
fallback_model = "gpt-5.4-mini"
timeout_s = 30.0

[guardrails]
max_position_pct = "20"
max_exposure_pct = "60"
max_order_pct = "10"
stop_loss_atr_mult = "2"
stop_loss_max_pct = "2"
daily_dd_soft_pct = "4"
soft_stop_pause_min = 30
total_dd_hard_pct = "8"
max_consecutive_losses = 4
loss_cooldown_min = 60
max_open_orders = 10
flatten_no_entry_min = 90
flatten_force_min = 30

[engine]
depth_interval_s = 3.0
trades_interval_s = 10.0
candles_interval_s = 60.0
allocator_interval_s = 60.0
reconcile_interval_s = 30.0
feed_budget_frac = 0.7
stale_after_intervals = 3.0
frozen_book_s = 60.0
socket_path = "data/engine.sock"
health_port = 8000
log_path = "data/logs/engine.log"

[paper]
capital_tmn = "5000000"
slippage_bps = "2"
maker_timeout_s = 60.0
position_frac = "0.2"

[strategies.basis_tmn_usdt]
# Paper-only (non-atomic legs); evaluated on live shadow books only, never on candles.
edge_margin_bps = "5"
timeframe = 1

[strategies.mean_reversion]
# TMN markets only for now (no USDT conversion cycles).
quotes = ["TMN"]
timeframe = 15
edge_margin_bps = "10"
vwap_bars = 60
z_entry = 2.0
exit_frac = 0.25
min_reward_risk = 1.5
time_stop_bars = 24

[strategies.momentum]
timeframe = 15
breakout_bars = 30
vol_ratio_min = 1.5
imbalance_min = 0.1
atr_target_mult = 2.0
cost_mult = 2.0
time_stop_bars = 16

[promotion]
# Live weight only if BOTH: the backtest replay passes (>= trades, net > 0, PF > min) AND
# shadow paper trades are not net-negative (>= min_shadow_trades).
min_backtest_trades = 10
min_profit_factor = "1.2"
min_shadow_trades = 3
demote_window_trades = 10
paper_only = ["basis_tmn_usdt"]

[alloc]
tau = 1.0
max_strategy_weight = "0.6"
score_window_trades = 30
usdt_rebalance_band_pct = "5"
usdt_min_hold_min = 60
usdt_breakeven_trades_per_cycle = "2"

[backtest]
history_days = 30
split_frac = 0.6666666667
timeframes = [1, 5, 15, 60]
min_is_trades = 10
# The engine refuses to PROMOTE from a walk-forward run older than max_run_age_h and warns at
# warn_run_age_h. An already-promoted strategy is never demoted just because the run aged.
max_run_age_h = 36
warn_run_age_h = 20

[backtest.grid_mean_reversion]
z_entry = [1.5, 2.0, 2.5]
exit_frac = [0.0, 0.25, 0.5]

[backtest.grid_momentum]
breakout_bars = [20, 40]
atr_target_mult = [2.0, 3.0]
vol_ratio_min = [1.5, 2.0]

[store]
db_path = "data/wallexer.db"
overrides_path = "data/overrides.toml"
